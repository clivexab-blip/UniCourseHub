name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Ensure google-services.json exists
      run: |
        if [ ! -f app/google-services.json ]; then
          echo '{
            "project_info": {
              "project_number": "123456789012",
              "project_id": "unicoursehub-app",
              "storage_bucket": "unicoursehub-app.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef1234567890",
                  "android_client_info": {
                    "package_name": "com.unicoursehub.app"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "123456789012-placeholder.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForUniCourseHubConfig123"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }' > app/google-services.json
        fi

    - name: Grant execute permission for gradlew
      run: |
        if [ ! -f ./gradlew ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Build and Test with Gradle
      run: ./gradlew assembleDebug test testDebugUnitTest
